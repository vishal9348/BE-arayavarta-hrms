spring:
  application:
    name: aryavarta-hrms
  datasource:
    url: jdbc:postgresql://localhost:3307/aryavarta_hrms
    username: postgres
    password: root
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
